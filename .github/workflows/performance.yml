name: Performance Monitoring

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  performance-audit:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production

      - name: Start application
        run: npm start &
        env:
          NODE_ENV: production

      - name: Wait for application to start
        run: npx wait-on http://localhost:3000 --timeout 30000

      - name: Run Lighthouse CI
        run: npx @lhci/cli@0.12.x autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Bundle Analysis
        run: npm run analyze
        env:
          ANALYZE: true

      - name: Upload bundle analysis
        uses: actions/upload-artifact@v4
        with:
          name: bundle-analysis
          path: .next/analyze/

      - name: Performance Budget Check
        run: |
          BUNDLE_SIZE=$(du -sb .next/static/chunks | cut -f1)
          MAX_BUNDLE_SIZE=1048576  # 1MB in bytes
          
          if [ $BUNDLE_SIZE -gt $MAX_BUNDLE_SIZE ]; then
            echo "Bundle size ($BUNDLE_SIZE bytes) exceeds limit ($MAX_BUNDLE_SIZE bytes)"
            exit 1
          else
            echo "Bundle size ($BUNDLE_SIZE bytes) is within limit"
          fi

  lighthouse-ci:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build and start application
        run: |
          npm run build
          npm start &
          npx wait-on http://localhost:3000

      - name: Run Lighthouse CI
        run: |
          npm install -g @lhci/cli@0.12.x
          lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Comment PR with Lighthouse results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            // Read Lighthouse results
            const resultsPath = '.lighthouseci';
            if (fs.existsSync(resultsPath)) {
              const files = fs.readdirSync(resultsPath);
              const reportFile = files.find(file => file.endsWith('.json'));
              
              if (reportFile) {
                const report = JSON.parse(fs.readFileSync(path.join(resultsPath, reportFile), 'utf8'));
                const scores = report.categories;
                
                const comment = `## 🚀 Lighthouse Performance Report
                
                | Category | Score |
                |----------|-------|
                | Performance | ${Math.round(scores.performance.score * 100)}/100 |
                | Accessibility | ${Math.round(scores.accessibility.score * 100)}/100 |
                | Best Practices | ${Math.round(scores['best-practices'].score * 100)}/100 |
                | SEO | ${Math.round(scores.seo.score * 100)}/100 |
                
                ### Core Web Vitals
                - **First Contentful Paint**: ${report.audits['first-contentful-paint'].displayValue}
                - **Largest Contentful Paint**: ${report.audits['largest-contentful-paint'].displayValue}
                - **Cumulative Layout Shift**: ${report.audits['cumulative-layout-shift'].displayValue}
                - **Total Blocking Time**: ${report.audits['total-blocking-time'].displayValue}
                `;
                
                github.rest.issues.createComment({
                  issue_number: context.issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: comment
                });
              }
            }

  bundle-size-check:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Analyze bundle size
        run: |
          npx next-bundle-analyzer --analyze
          
          # Check bundle size limits
          echo "Checking bundle size limits..."
          
          # Main bundle limit (250KB gzipped)
          MAIN_SIZE=$(gzip -c .next/static/chunks/main-*.js | wc -c)
          if [ $MAIN_SIZE -gt 256000 ]; then
            echo "❌ Main bundle too large: ${MAIN_SIZE} bytes (limit: 256000)"
            exit 1
          else
            echo "✅ Main bundle size OK: ${MAIN_SIZE} bytes"
          fi
          
          # Total JS limit (1MB uncompressed)
          TOTAL_JS=$(find .next/static/chunks -name "*.js" -exec cat {} \; | wc -c)
          if [ $TOTAL_JS -gt 1048576 ]; then
            echo "❌ Total JS too large: ${TOTAL_JS} bytes (limit: 1048576)"
            exit 1
          else
            echo "✅ Total JS size OK: ${TOTAL_JS} bytes"
          fi

      - name: Comment bundle size on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            // Calculate bundle sizes
            const chunksDir = '.next/static/chunks';
            let totalSize = 0;
            const chunks = [];
            
            if (fs.existsSync(chunksDir)) {
              const files = fs.readdirSync(chunksDir);
              files.forEach(file => {
                if (file.endsWith('.js')) {
                  const filePath = path.join(chunksDir, file);
                  const size = fs.statSync(filePath).size;
                  totalSize += size;
                  chunks.push({ name: file, size });
                }
              });
            }
            
            const formatSize = (bytes) => {
              if (bytes === 0) return '0 Bytes';
              const k = 1024;
              const sizes = ['Bytes', 'KB', 'MB', 'GB'];
              const i = Math.floor(Math.log(bytes) / Math.log(k));
              return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
            };
            
            const comment = `## 📦 Bundle Size Report
            
            **Total Bundle Size**: ${formatSize(totalSize)}
            
            ### Chunk Breakdown:
            ${chunks.sort((a, b) => b.size - a.size).slice(0, 5).map(chunk => 
              `- **${chunk.name}**: ${formatSize(chunk.size)}`
            ).join('\n')}
            
            ${totalSize > 1048576 ? '⚠️ Bundle size exceeds 1MB limit!' : '✅ Bundle size within limits'}
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });